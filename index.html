<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Portal de Scripts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background-color: #1e293b; border: 1px solid #334155; padding: 35px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; }
        h2 { margin-bottom: 5px; color: #22c55e; }
        p.sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; font-weight: 600; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        input:focus { border-color: #22c55e; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background-color: #22c55e; color: #fff; }
        .btn-primary:hover { background-color: #16a34a; }
        .btn-google { background-color: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .divider { margin: 20px 0; border-bottom: 1px solid #334155; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 10px; color: #94a3b8; font-size: 0.8rem; }
        #status-msg { margin-top: 15px; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Acessar o Portal</h2>
        <p class="sub">Faça seu cadastro para liberar os scripts.</p>
        
        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>
            <div class="input-group">
                <label for="telefone">Telefone / WhatsApp *</label>
                <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>
            <div class="input-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" required placeholder="seu.email@exemplo.com">
            </div>
            <button type="submit" class="btn btn-primary" id="btnEnviar">Entrar no Site</button>
        </form>

        <div class="divider"><span>ou</span></div>

        <button type="button" class="btn btn-google" id="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
            Entrar com o Google
        </button>

        <div id="status-msg"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_kHA-qWqzE8DuziXAn9c_G9RyI1Dt2e0",
            authDomain: "script-site-yanh.firebaseapp.com",
            projectId: "script-site-yanh",
            storageBucket: "script-site-yanh.firebasestorage.app",
            messagingSenderId: "704247631885",
            appId: "1:704247631885:web:257784220a753c8f638544",
            measurementId: "G-GB07JXLGTB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const DISCORD_WEBHOOK_CADASTROS = "https://discord.com/api/webhooks/1535855687463079976/hJiTmJLGk_UTf98dXQnG5MIbzkzNdJajMcVE4KwP31QhaNyllpvUnJV9a9Xsp6EycaZV";

        async function notificarEntradaDiscord(nome, telefone, email, metodo) {
            const payload = {
                username: "Notificador de Acessos",
                embeds: [{
                    title: "👤 NOVO USUÁRIO ENTROU NO SITE!",
                    color: 3066993,
                    fields: [
                        { name: "👤 Nome", value: nome, inline: false },
                        { name: "📞 Telefone", value: telefone, inline: true },
                        { name: "✉️ E-mail", value: email, inline: true },
                        { name: "🔑 Método de Entrada", value: metodo, inline: false }
                    ],
                    footer: { text: "Registro de Acesso do Portal" }
                }]
            };

            try {
                await fetch(DISCORD_WEBHOOK_CADASTROS, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error(e); }
        }

        document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const nome = document.getElementById("nome").value;
            const telefone = document.getElementById("telefone").value;
            const email = document.getElementById("email").value;

            localStorage.setItem("usuario_logado", email);
            await notificarEntradaDiscord(nome, telefone, email, "Cadastro Manual");
            window.location.href = "dashboard.html";
        });

        document.getElementById("btn-google").addEventListener("click", async () => {
            try {
                const res = await signInWithPopup(auth, provider);
                const user = res.user;
                localStorage.setItem("usuario_logado", user.email);
                await notificarEntradaDiscord(user.displayName || "Usuário Google", "Não Informado", user.email, "Conta Google");
                window.location.href = "dashboard.html";
            } catch (error) {
                document.getElementById("status-msg").innerText = "Erro ao logar com o Google.";
            }
        });
    </script>
</body>
</html>
