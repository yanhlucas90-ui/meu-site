<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Scripts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background-color: #1e293b; border: 1px solid #334155; padding: 35px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #22c55e; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        input:focus { border-color: #22c55e; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background-color: #22c55e; color: #fff; }
        .btn-primary:hover { background-color: #16a34a; }
        .btn-google { background-color: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-google:hover { background-color: #e2e8f0; }
        .divider { margin: 20px 0; border-bottom: 1px solid #334155; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 10px; color: #94a3b8; font-size: 0.8rem; }
        #error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; }
        .toggle-mode { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
        .toggle-mode a { color: #22c55e; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="form-title">Entrar na Conta</h2>
        
        <form id="auth-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Sua senha">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">Entrar</button>
        </form>

        <div class="divider"><span>ou</span></div>

        <button type="button" class="btn btn-google" id="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
            Entrar com o Google
        </button>

        <p id="error-msg"></p>

        <p class="toggle-mode">
            <span id="toggle-text">Não tem uma conta?</span> 
            <a id="toggle-link">Cadastrar-se</a>
        </p>
    </div>

    <!-- Firebase SDK (Módulos Web) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // SUAS CREDENCIAIS CONFIGURADAS DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyD_kHA-qWqzE8DuziXAn9c_G9RyI1Dt2e0",
            authDomain: "script-site-yanh.firebaseapp.com",
            projectId: "script-site-yanh",
            storageBucket: "script-site-yanh.firebasestorage.app",
            messagingSenderId: "704247631885",
            appId: "1:704247631885:web:257784220a753c8f638544",
            measurementId: "G-GB07JXLGTB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let isLogin = true;

        const authForm = document.getElementById("auth-form");
        const formTitle = document.getElementById("form-title");
        const btnSubmit = document.getElementById("btn-submit");
        const toggleLink = document.getElementById("toggle-link");
        const toggleText = document.getElementById("toggle-text");
        const errorMsg = document.getElementById("error-msg");

        // Alternar entre Login e Cadastro
        toggleLink.addEventListener("click", () => {
            isLogin = !isLogin;
            formTitle.innerText = isLogin ? "Entrar na Conta" : "Criar Nova Conta";
            btnSubmit.innerText = isLogin ? "Entrar" : "Cadastrar";
            toggleText.innerText = isLogin ? "Não tem uma conta?" : "Já tem uma conta?";
            toggleLink.innerText = isLogin ? "Cadastrar-se" : "Entrar";
            errorMsg.innerText = "";
        });

        // Login / Cadastro com E-mail e Senha
        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.innerText = "";
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = "dashboard.html";
            } catch (error) {
                errorMsg.innerText = traduzirErro(error.code);
            }
        });

        // Login com Google
        document.getElementById("btn-google").addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "dashboard.html";
            } catch (error) {
                errorMsg.innerText = "Erro ao conectar com a conta do Google.";
            }
        });

        function traduzirErro(code) {
            switch(code) {
                case 'auth/user-not-found': return 'Usuário não encontrado.';
                case 'auth/wrong-password': return 'Senha incorreta.';
                case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
                case 'auth/email-already-in-use': return 'Este e-mail já está em uso.';
                case 'auth/weak-password': return 'A senha precisa ter no mínimo 6 caracteres.';
                default: return 'Falha na autenticação. Verifique os dados.';
            }
        }
    </script>
</body>
</html>
