<!-- ESTILOS DO FORMULÁRIO -->
<style>
    .form-container {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 30px;
        max-width: 450px;
        margin: 40px auto;
        color: #f8fafc;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .form-container h2 {
        margin-bottom: 5px;
        color: #22c55e;
    }

    .form-container p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 15px;
        text-align: left;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .form-group input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        background-color: #0f172a;
        color: #ffffff;
        font-size: 0.95rem;
        outline: none;
    }

    .form-group input:focus {
        border-color: #22c55e;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #22c55e;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-submit:hover {
        background-color: #16a34a;
    }

    #status-msg {
        margin-top: 15px;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
    }
</style>

<!-- ESTRUTURA DO FORMULÁRIO -->
<div class="form-container">
    <h2>Cadastre-se</h2>
    <p>Preencha os campos abaixo para concluir seu cadastro.</p>

    <form id="discordForm">
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone / WhatsApp *</label>
            <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
        </div>

        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="seu.email@exemplo.com">
        </div>

        <button type="submit" class="btn-submit" id="btnEnviar">Enviar Cadastro</button>
        <div id="status-msg"></div>
    </form>
</div>

<!-- SCRIPT DE ENVIO PARA O DISCORD -->
<script>
    // Cole aqui o seu link do Webhook do Discord
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1535855687463079976/hJiTmJLGk_UTf98dXQnG5MIbzkzNdJajMcVE4KwP31QhaNyllpvUnJV9a9Xsp6EycaZV";

    document.getElementById("discordForm").addEventListener("submit", async function(event) {
        event.preventDefault(); // Impede o recarregamento da página

        const btn = document.getElementById("btnEnviar");
        const statusMsg = document.getElementById("status-msg");

        const nome = document.getElementById("nome").value.trim();
        const telefone = document.getElementById("telefone").value.trim();
        const email = document.getElementById("email").value.trim();

        // Altera o estado do botão para o usuário ver que está enviando
        btn.disabled = true;
        btn.innerText = "Enviando...";
        statusMsg.innerText = "";

        // Monta o payload no formato Embed do Discord
        const payload = {
            username: "Notificador do Site",
            avatar_url: "https://i.imgur.com/4M34hi2.png",
            embeds: [{
                title: "🌐 NOVO CADASTRO VIA SITE!",
                color: 3066993, // Verde
                fields: [
                    { name: "👤 Nome Completo", value: nome, inline: false },
                    { name: "📞 Telefone", value: telefone, inline: true },
                    { name: "✉️ E-mail", value: email, inline: true }
                ],
                footer: { text: "Enviado direto do GitHub Pages" }
            }]
        };

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusMsg.style.color = "#22c55e";
                statusMsg.innerText = "✅ Cadastro enviado com sucesso!";
                document.getElementById("discordForm").reset(); // Limpa os campos
            } else {
                throw new Error("Erro na resposta do servidor");
            }
        } catch (error) {
            statusMsg.style.color = "#ef4444";
            statusMsg.innerText = "❌ Falha ao enviar. Tente novamente.";
            console.error("Erro:", error);
        } finally {
            btn.disabled = false;
            btn.innerText = "Enviar Cadastro";
        }
    });
</script>
